name: Publish expanded R12 paper
on:
  push:
    branches: [main]
    paths:
      - 'r12_answer_20260925/paper_full_v2_expanded_20260926/PUBLISH.json'
permissions:
  contents: write
concurrency:
  group: r12-expanded-paper
  cancel-in-progress: false
jobs:
  build-paper:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET: r12_answer_20260925/paper_full_v2_expanded_20260926
    steps:
      - uses: actions/checkout@v4
      - name: Install document rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer fonts-noto-cjk fonts-stix fonts-liberation
          python3 -m pip install --quiet python-docx==1.2.0 pypandoc-binary Pillow PyMuPDF numpy scipy
      - name: Verify and combine readable source patches
        run: |
          python3 - <<'PY'
          import os, json, hashlib, ast
          from pathlib import Path
          root = Path(os.environ['TARGET'])
          release = json.loads((root/'PUBLISH.json').read_text())
          edits = {}
          for path in sorted(root.glob('edits_*.json')):
              part = json.loads(path.read_text())
              if set(edits) & set(part):
                  raise ValueError('Duplicate paragraph patch')
              edits.update(part)
          canonical = json.dumps(edits, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode()
          assert len(edits) == 190
          assert hashlib.sha256(canonical).hexdigest() == release['edits_sha256'], 'Patch transfer mismatch'
          (root/'edits.json').write_text(json.dumps(edits, ensure_ascii=False, indent=2))
          def norm(x):
              if isinstance(x, ast.AST):
                  return {'node': type(x).__name__, **{k:norm(v) for k,v in ast.iter_fields(x) if v is not None and v != []}}
              if isinstance(x, list): return [norm(v) for v in x]
              return x
          semantic = json.dumps(norm(ast.parse((root/'build_paper.py').read_text())), ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode()
          actual = hashlib.sha256(semantic).hexdigest()
          print('Normalized builder hash:', actual)
          assert actual == release['builder_ast_sha256'], 'Builder transfer mismatch'
          PY
          mkdir -p "$HOME/.config/fontconfig/conf.d"
          cp "$TARGET/fonts.conf" "$HOME/.config/fontconfig/conf.d/99-r12-fonts.conf"
          fc-cache -f
      - name: Build Word from the frozen original and export PDF
        run: |
          python3 "$TARGET/build_paper.py"
          timeout 480 libreoffice -env:UserInstallation=file:///tmp/r12-expanded-lo --headless --convert-to pdf --outdir "$TARGET/out" "$TARGET/out/R12论文_完整增强版_匿名.docx"
          python3 "$TARGET/verify_release.py"
      - name: Publish only the new paper directory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$TARGET"
          if ! git diff --cached --quiet; then
            git commit -m 'Publish expanded R12 Word/PDF with frozen-result checks; keep original paper and experiments unchanged'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: R12-expanded-paper
          path: r12_answer_20260925/paper_full_v2_expanded_20260926/out/
          retention-days: 30
