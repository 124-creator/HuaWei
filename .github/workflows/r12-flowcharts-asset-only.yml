name: R12 isolated flowchart export
on:
  push:
    branches: ['design/r12-flowcharts-20260926']
    paths:
      - '.github/workflows/r12-flowcharts-asset-only.yml'
      - 'r12_answer_20260925/流程图_优化版_20260926/build.py'
      - 'r12_answer_20260925/流程图_优化版_20260926/export_native.py'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASSETS: r12_answer_20260925/流程图_优化版_20260926
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/r12-flowcharts-20260926
          fetch-depth: 0
      - name: Install isolated diagram dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-wqy-zenhei fonts-liberation poppler-utils xvfb libgtk-3-0 libnss3 libgbm1 libasound2t64
          curl -fL --retry 2 -o /tmp/drawio.deb https://github.com/jgraph/drawio-desktop/releases/download/v31.5.2/drawio-amd64-31.5.2.deb
          sudo apt-get install -y /tmp/drawio.deb
          python -m pip install matplotlib pymupdf pillow shapely
          fc-cache -f
      - name: Public reference inspection and original preview archive
        continue-on-error: true
        run: |
          mkdir -p /tmp/reference-inspection
          python - <<'PY'
          import urllib.request,json
          from pathlib import Path
          import fitz,shutil
          out=Path('/tmp/reference-inspection');records=[]
          samples=[('shenzhen2015B6','https://dxs.moe.gov.cn/zx/2015/1208/1449543854497.pdf',[9,10,11]),('qust2014D','https://sl.qust.edu.cn/system/_content/download.jsp?owner=1341077456&urltype=news.DownloadAttachUrl&wbfileid=2136828',None)]
          for name,url,pages in samples:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  data=urllib.request.urlopen(req,timeout=45).read()
                  if not data.startswith(b'%PDF'):raise ValueError('Response is not a PDF; no captcha or authentication bypass')
                  doc=fitz.open(stream=data,filetype='pdf')
                  if pages is None:pages=[i for i,p in enumerate(doc) if any(w in p.get_text() for w in ['流程图','技术路线'])][:5]
                  for i in pages:
                      doc[i].get_pixmap(dpi=160,alpha=False).save(out/f'{name}_page{i+1}.png')
                      (out/f'{name}_page{i+1}.txt').write_text(doc[i].get_text(),encoding='utf-8')
                  records.append(dict(sample=name,url=url,status='rendered',pages_1based=[i+1 for i in pages],page_count=len(doc)))
              except Exception as e:records.append(dict(sample=name,url=url,status='failed',error=str(e)))
          src=Path('参考材料/流程图_初级稿件_20260925')
          for p in src.glob('*.png'):shutil.copy2(p,out/p.name)
          (out/'retrieval.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Generate editable sources and geometry checks
        run: python "$ASSETS/build.py"
      - name: Native draw.io vector export and final-byte preflight
        run: python "$ASSETS/export_native.py"
      - name: Commit only newly generated assets
        run: |
          test "$(git rev-parse HEAD:r12_answer_20260925/paper_full_v1)" = b5efb436bef9b62e5ff138fc50721ebb4da1f5d4
          find "$ASSETS" -type d -name __pycache__ -prune -exec rm -rf {} +
          git add "$ASSETS"
          python - <<'PY'
          import subprocess
          prefix='r12_answer_20260925/流程图_优化版_20260926/'
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          assert all(not p or p.startswith(prefix) for p in paths), paths
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Export four editable flowcharts as native vectors and 600dpi previews; all preflight checks pass'
            git push origin HEAD:design/r12-flowcharts-20260926
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R12-flowchart-assets-review
          path: r12_answer_20260925/流程图_优化版_20260926/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R12-reference-inspection-private
          path: /tmp/reference-inspection/
          retention-days: 1
          if-no-files-found: warn
