name: R12 isolated flowchart export
on:
  push:
    branches: ['design/r12-flowcharts-20260926']
    paths:
      - '.github/workflows/r12-flowcharts-asset-only.yml'
      - 'r12_answer_20260925/流程图_优化版_20260926/build.py'
      - 'r12_answer_20260925/流程图_优化版_20260926/export_native.py'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASSETS: r12_answer_20260925/流程图_优化版_20260926
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/r12-flowcharts-20260926
          fetch-depth: 0
      - name: Install isolated diagram dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-wqy-zenhei fonts-liberation poppler-utils xvfb libgtk-3-0 libnss3 libgbm1 libasound2t64
          curl -fL --retry 2 -o /tmp/drawio.deb https://github.com/jgraph/drawio-desktop/releases/download/v31.5.2/drawio-amd64-31.5.2.deb
          sudo apt-get install -y /tmp/drawio.deb
          python -m pip install matplotlib pymupdf pillow shapely
          fc-cache -f
      - name: Generate editable sources and geometry checks
        run: python "$ASSETS/build.py"
      - name: Native draw.io vector export and final-byte preflight
        run: python "$ASSETS/export_native.py"
      - name: Commit only newly generated assets
        run: |
          find "$ASSETS" -type d -name __pycache__ -prune -exec rm -rf {} +
          git add "$ASSETS"
          python - <<'PY'
          import subprocess
          prefix='r12_answer_20260925/流程图_优化版_20260926/'
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          assert all(not p or p.startswith(prefix) for p in paths), paths
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'V1.1 export enlarged flowchart typography; geometry preflight passes'
            git push origin HEAD:design/r12-flowcharts-20260926
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R12-flowchart-assets-review
          path: r12_answer_20260925/流程图_优化版_20260926/
          retention-days: 7
          if-no-files-found: error
