name: Current-paper flowchart terminology and typography QA
on:
  push:
    branches: ['design/body-flowchart-fonts-20260926']
    paths:
      - '.github/workflows/body-flowchart-fonts.yml'
      - 'r12_answer_20260925/paper_full_v1/code/flowcharts.py'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ROOT: r12_answer_20260925/paper_full_v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/body-flowchart-fonts-20260926
          fetch-depth: 0
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-wqy-zenhei fonts-liberation poppler-utils
          python -m pip install matplotlib pymupdf pillow
          fc-cache -f
      - name: Render only current manuscript flowcharts
        run: python "$ROOT/code/flowcharts.py"
      - name: Check vector output and minimum CJK size
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          import fitz
          from PIL import Image
          root=Path('r12_answer_20260925/paper_full_v1')
          figs=['F35','F38','F39','F40']; qdir=root/'qa'/'正文流程图字体增强_20260926'; qdir.mkdir(parents=True,exist_ok=True)
          out={'scope':'current manuscript F35/F38/F39/F40 only; manuscript DOCX/PDF not rebuilt','figures':[],'errors':[]}
          for name in figs:
              pdf=root/'figures'/f'{name}.pdf'; png=root/'figures'/f'{name}.png'; svg=root/'figures'/f'{name}.svg'
              doc=fitz.open(pdf); page=doc[0]
              page.get_pixmap(matrix=fitz.Matrix(180/72,180/72),alpha=False).save(qdir/f'{name}_180dpi.png')
              spans=[sp for b in page.get_text('dict')['blocks'] for ln in b.get('lines',[]) for sp in ln.get('spans',[]) if sp.get('text','').strip()]
              cjk=[sp for sp in spans if any(ord(ch)>=0x2e80 for ch in sp.get('text',''))]
              cjk_sizes=[float(sp['size']) for sp in cjk]; sizes=[float(sp['size']) for sp in spans]
              fonts=subprocess.check_output(['pdffonts',str(pdf)],text=True)
              im=Image.open(png)
              rec={'figure':name,'page_mm':[round(page.rect.width*25.4/72,2),round(page.rect.height*25.4/72,2)],
                   'min_text_pt':round(min(sizes),3),'min_cjk_pt':round(min(cjk_sizes),3),'max_text_pt':round(max(sizes),3),
                   'pdf_raster_images':len(page.get_images(full=True)),'png_px':list(im.size),'png_dpi':list(im.info.get('dpi',(0,0))),'fonts':fonts}
              if rec['pdf_raster_images']: out['errors'].append([name,'pdf_contains_raster'])
              if rec['min_cjk_pt']<8.85: out['errors'].append([name,'cjk_font_too_small',rec['min_cjk_pt']])
              if min(rec['png_dpi'])<599: out['errors'].append([name,'png_dpi_low'])
              if '<image' in svg.read_text(errors='ignore'): out['errors'].append([name,'svg_contains_image'])
              out['figures'].append(rec)
          (qdir/'qa.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if out['errors']: raise SystemExit(2)
          PY
      - name: Commit only flowchart source, four figures and QA
        run: |
          git add "$ROOT/code/flowcharts.py" "$ROOT/figures/F35.pdf" "$ROOT/figures/F35.png" "$ROOT/figures/F35.svg" \
                  "$ROOT/figures/F38.pdf" "$ROOT/figures/F38.png" "$ROOT/figures/F38.svg" \
                  "$ROOT/figures/F39.pdf" "$ROOT/figures/F39.png" "$ROOT/figures/F39.svg" \
                  "$ROOT/figures/F40.pdf" "$ROOT/figures/F40.png" "$ROOT/figures/F40.svg" \
                  "$ROOT/qa/正文流程图字体增强_20260926"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate current-paper flowcharts after terminology cleanup'
            git push origin HEAD:design/body-flowchart-fonts-20260926
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-paper-flowcharts-final-review
          path: |
            r12_answer_20260925/paper_full_v1/figures/F35.*
            r12_answer_20260925/paper_full_v1/figures/F38.*
            r12_answer_20260925/paper_full_v1/figures/F39.*
            r12_answer_20260925/paper_full_v1/figures/F40.*
            r12_answer_20260925/paper_full_v1/qa/正文流程图字体增强_20260926/
          retention-days: 7
