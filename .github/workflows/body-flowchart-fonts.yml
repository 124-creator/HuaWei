name: Current-paper flowchart typography QA
on:
  push:
    branches: ['design/body-flowchart-fonts-20260926']
    paths:
      - '.github/workflows/body-flowchart-fonts.yml'
      - 'r12_answer_20260925/paper_full_v1/code/flowcharts.py'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ROOT: r12_answer_20260925/paper_full_v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/body-flowchart-fonts-20260926
          fetch-depth: 0
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-wqy-zenhei fonts-liberation poppler-utils
          python -m pip install matplotlib pymupdf pillow
          fc-cache -f
      - name: Render only current manuscript flowcharts
        run: |
          python "$ROOT/code/flowcharts.py"
      - name: Check font sizes, vector output and page bounds
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          import fitz
          from PIL import Image
          root=Path('r12_answer_20260925/paper_full_v1')
          figs=['F35','F38','F39','F40']
          out={'scope':'current manuscript F35/F38/F39/F40 only; manuscript DOCX/PDF not rebuilt','figures':[],'errors':[]}
          qdir=root/'qa'/'正文流程图字体增强_20260926'
          qdir.mkdir(parents=True,exist_ok=True)
          for name in figs:
              pdf=root/'figures'/f'{name}.pdf'; png=root/'figures'/f'{name}.png'; svg=root/'figures'/f'{name}.svg'
              doc=fitz.open(pdf); page=doc[0]
              pix=page.get_pixmap(matrix=fitz.Matrix(180/72,180/72),alpha=False)
              pix.save(qdir/f'{name}_180dpi.png')
              spans=[]
              for block in page.get_text('dict')['blocks']:
                  for line in block.get('lines',[]):
                      for sp in line.get('spans',[]):
                          if sp.get('text','').strip(): spans.append(sp)
              sizes=[float(sp['size']) for sp in spans]
              cjk=[sp for sp in spans if any(ord(ch)>=0x2e80 for ch in sp.get('text',''))]
              cjk_sizes=[float(sp['size']) for sp in cjk]
              fonts=subprocess.check_output(['pdffonts',str(pdf)],text=True)
              images=len(page.get_images(full=True))
              im=Image.open(png)
              rec={
                'figure':name,
                'page_mm':[round(page.rect.width*25.4/72,2),round(page.rect.height*25.4/72,2)],
                'min_text_pt':round(min(sizes),3) if sizes else None,
                'min_cjk_pt':round(min(cjk_sizes),3) if cjk_sizes else None,
                'max_text_pt':round(max(sizes),3) if sizes else None,
                'pdf_raster_images':images,
                'png_px':list(im.size),
                'png_dpi':list(im.info.get('dpi',(0,0))),
                'fonts':fonts
              }
              if images: out['errors'].append([name,'pdf_contains_raster',images])
              if cjk_sizes and min(cjk_sizes)<8.85: out['errors'].append([name,'cjk_font_too_small',min(cjk_sizes)])
              if min(im.info.get('dpi',(0,0)))<599: out['errors'].append([name,'png_dpi_low',im.info.get('dpi')])
              if '<image' in svg.read_text(errors='ignore'): out['errors'].append([name,'svg_contains_image'])
              out['figures'].append(rec)
          (qdir/'qa.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if out['errors']: raise SystemExit(2)
          PY
      - name: Commit only flowchart source, four figures and QA
        run: |
          git add "$ROOT/code/flowcharts.py" "$ROOT/figures/F35.pdf" "$ROOT/figures/F35.png" "$ROOT/figures/F35.svg" \
                  "$ROOT/figures/F38.pdf" "$ROOT/figures/F38.png" "$ROOT/figures/F38.svg" \
                  "$ROOT/figures/F39.pdf" "$ROOT/figures/F39.png" "$ROOT/figures/F39.svg" \
                  "$ROOT/figures/F40.pdf" "$ROOT/figures/F40.png" "$ROOT/figures/F40.svg" \
                  "$ROOT/qa/正文流程图字体增强_20260926"
          python - <<'PY'
          import subprocess
          allowed=[
            'r12_answer_20260925/paper_full_v1/code/flowcharts.py',
            'r12_answer_20260925/paper_full_v1/figures/F35.',
            'r12_answer_20260925/paper_full_v1/figures/F38.',
            'r12_answer_20260925/paper_full_v1/figures/F39.',
            'r12_answer_20260925/paper_full_v1/figures/F40.',
            'r12_answer_20260925/paper_full_v1/qa/正文流程图字体增强_20260926/'
          ]
          paths=subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          bad=[p for p in paths if not any(p==a or p.startswith(a) for a in allowed)]
          assert not bad,bad
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate current-paper F35 F38 F39 F40 with larger typography'
            git push origin HEAD:design/body-flowchart-fonts-20260926
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-paper-flowcharts-font-v11
          path: |
            r12_answer_20260925/paper_full_v1/figures/F35.*
            r12_answer_20260925/paper_full_v1/figures/F38.*
            r12_answer_20260925/paper_full_v1/figures/F39.*
            r12_answer_20260925/paper_full_v1/figures/F40.*
            r12_answer_20260925/paper_full_v1/qa/正文流程图字体增强_20260926/
          retention-days: 7
