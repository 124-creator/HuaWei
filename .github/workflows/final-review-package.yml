name: Package final paper and updated flowcharts for review
on:
  push:
    branches: ['final/submission-review-20260927']
    paths:
      - '.github/workflows/final-review-package.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final/submission-review-20260927
          fetch-depth: 0
      - name: Fetch updated current-paper flowcharts
        run: |
          git fetch origin design/body-flowchart-fonts-20260926
          mkdir -p /tmp/final-review/input /tmp/final-review/flowcharts
          cp "最终提交_20260927/01_论文/多核NPU切图调度论文_提交版_修复.docx" /tmp/final-review/input/final.docx
          cp "最终提交_20260927/01_论文/A26104850001.pdf" /tmp/final-review/input/final.pdf
          for n in F35 F38 F39 F40; do
            git show origin/design/body-flowchart-fonts-20260926:"r12_answer_20260925/paper_full_v1/figures/${n}.png" > "/tmp/final-review/flowcharts/${n}.png"
            git show origin/design/body-flowchart-fonts-20260926:"r12_answer_20260925/paper_full_v1/figures/${n}.pdf" > "/tmp/final-review/flowcharts/${n}.pdf"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: final-paper-review-inputs
          path: /tmp/final-review/
          retention-days: 2
