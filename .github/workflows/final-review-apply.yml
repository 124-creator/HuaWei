name: Apply reviewed flowcharts to final submission
on:
  push:
    branches: ['final/submission-review-20260927']
    paths:
      - '.github/workflows/final-review-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final/submission-review-20260927
          fetch-depth: 0
      - name: Install binary editing dependencies
        run: python -m pip install pillow pymupdf==1.26.7
      - name: Fetch reviewed flowcharts
        run: git fetch origin design/body-flowchart-fonts-20260926
      - name: Patch final DOCX and formal-named PDF
        run: |
          python - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          from PIL import Image
          from pathlib import Path
          import fitz, io, hashlib, json, shutil, subprocess, re

          root=Path('最终提交_20260927')
          paper=root/'01_论文'
          qa=root/'04_核验记录'
          src_docx=paper/'多核NPU切图调度论文_提交版_修复.docx'
          out_docx=paper/'多核NPU切图调度论文_终审流程图版.docx'
          src_pdf=paper/'A26104850001.pdf'
          baseline_pdf=paper/'多核NPU切图调度论文_提交版_修复_Windows导出.pdf'
          tmp=Path('/tmp/final-flowcharts'); tmp.mkdir(parents=True,exist_ok=True)

          branch='origin/design/body-flowchart-fonts-20260926'
          srcs={}
          for n in ('F35','F38','F39','F40'):
              p=tmp/f'{n}.png'
              with p.open('wb') as f:
                  subprocess.run(['git','show',f'{branch}:r12_answer_20260925/paper_full_v1/figures/{n}.png'],check=True,stdout=f)
              srcs[n]=p

          mapping={
             'word/media/image7.png':('F35',(2400,2571)),
             'word/media/image13.png':('F38',(2400,2429)),
             'word/media/image21.png':('F39',(2400,3086)),
             'word/media/image30.png':('F40',(2400,2529)),
          }
          prepared={}
          for entry,(fname,target) in mapping.items():
              im=Image.open(srcs[fname]).convert('RGB')
              tw,th=target
              scale=min(tw/im.width,th/im.height)
              nw,nh=round(im.width*scale),round(im.height*scale)
              im=im.resize((nw,nh),Image.Resampling.LANCZOS)
              canvas=Image.new('RGB',(tw,th),'white')
              canvas.paste(im,((tw-nw)//2,(th-nh)//2))
              b=io.BytesIO(); canvas.save(b,'PNG',optimize=True,dpi=(600,600))
              prepared[entry]=b.getvalue()

          with ZipFile(src_docx,'r') as zin, ZipFile(out_docx,'w',ZIP_DEFLATED) as zout:
              for item in zin.infolist():
                  zout.writestr(item,prepared.get(item.filename,zin.read(item.filename)))

          with ZipFile(src_docx) as za, ZipFile(out_docx) as zb:
              structural={}
              for n in ('word/document.xml','word/_rels/document.xml.rels','word/styles.xml','docProps/core.xml'):
                  structural[n]={'before':hashlib.sha256(za.read(n)).hexdigest(),'after':hashlib.sha256(zb.read(n)).hexdigest()}
                  assert structural[n]['before']==structural[n]['after']
              names=sorted(set(za.namelist())|set(zb.namelist()))
              changed=[]
              for n in names:
                  a=za.read(n) if n in za.namelist() else b''
                  b=zb.read(n) if n in zb.namelist() else b''
                  if hashlib.sha256(a).digest()!=hashlib.sha256(b).digest(): changed.append(n)
              assert changed==sorted(mapping),changed

          doc=fitz.open(baseline_pdf)
          page_map={7:'word/media/image7.png',26:'word/media/image13.png',37:'word/media/image21.png',47:'word/media/image30.png'}
          pdf_records=[]
          old_text=[p.get_text() for p in doc]
          old_renders=[]
          for p in doc:
              pix=p.get_pixmap(matrix=fitz.Matrix(1,1),alpha=False)
              old_renders.append((pix.width,pix.height,pix.samples))
          for pno,entry in page_map.items():
              pg=doc[pno]; infos=pg.get_image_info(xrefs=True)
              assert len(infos)==1,(pno,len(infos))
              rect=fitz.Rect(infos[0]['bbox'])
              pg.draw_rect(rect,color=None,fill=(1,1,1),overlay=True)
              pg.insert_image(rect,stream=prepared[entry],keep_proportion=False,overlay=True)
              pdf_records.append({'page':pno+1,'bbox':[round(x,2) for x in rect],'entry':entry})
          tmp_pdf=tmp/'A26104850001.pdf'
          doc.save(tmp_pdf,garbage=4,deflate=True,clean=True); doc.close()
          nd=fitz.open(tmp_pdf)
          assert len(nd)==95
          assert [p.get_text() for p in nd]==old_text
          changed_pages=[]
          for i,p in enumerate(nd):
              pix=p.get_pixmap(matrix=fitz.Matrix(1,1),alpha=False)
              ow,oh,os=old_renders[i]
              assert (pix.width,pix.height)==(ow,oh)
              if pix.samples!=os: changed_pages.append(i+1)
          assert changed_pages==[8,27,38,48],changed_pages
          nd.close()
          shutil.copy2(tmp_pdf,src_pdf)

          def sha(path,algo='sha256'):
              h=hashlib.new(algo)
              with open(path,'rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()

          before={'named_pdf_sha256_before':'91dd6952b6ff40b969c9366fb6d4a61cb13942a6c659feb9b7ddc4f1fe49e647',
                  'named_pdf_md5_before':'477fec907caaf90db7b2e0b89c4ba3b6',
                  'source_docx_sha256':sha(src_docx)}
          after={'named_pdf_sha256_after':sha(src_pdf),
                 'named_pdf_md5_after':sha(src_pdf,'md5'),
                 'review_docx_sha256':sha(out_docx)}
          rec={'scope':'flowchart replacement only; no solver/evaluator execution',
               'flowchart_source_branch':'design/body-flowchart-fonts-20260926',
               'flowchart_source_commit':subprocess.check_output(['git','rev-parse',branch]).decode().strip(),
               'docx_changed_entries':changed,'docx_structural_hashes':structural,
               'pdf_pages':95,'pdf_text_changed_pages':[],'pdf_render_changed_pages':changed_pages,
               'pdf_image_records':pdf_records,**before,**after}
          (qa/'流程图替换终审核验_20260927.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')

          (qa/'论文识别码MD5_预计算.txt').write_text(
              f"文件: 01_论文/A26104850001.pdf\nMD5: {after['named_pdf_md5_after']}\nSHA256: {after['named_pdf_sha256_after']}\n"
              "说明: 本值为流程图替换后的预计算，供与官方 FileMD5.exe 现场生成结果互核；\n"
              "     正式提交以对最终上传文件现场生成的论文识别码为准；生成后不得再改动文件。\n",encoding='utf-8')

          targets=[paper/'A26104850001.pdf',paper/'多核NPU切图调度论文_终审流程图版.docx',
                   paper/'多核NPU切图调度论文_提交版_修复_Windows导出.pdf',paper/'多核NPU切图调度论文_提交版_修复.docx',
                   paper/'多核NPU切图调度论文_提交版.docx',paper/'多核NPU切图调度论文_排版核对.pdf',
                   root/'02_支撑材料/支撑材料.zip']
          (qa/'SHA256SUMS.txt').write_text('\n'.join(f"{sha(p)}  {p.relative_to(root).as_posix()}" for p in targets)+'\n',encoding='utf-8')

          rp=root/'README_提交包说明与状态.md'
          s=rp.read_text(encoding='utf-8')
          s=re.sub(r'\| .01_论文/A26104850001\.pdf. \| \*\*待确认命名版\*\*（内容=修复版导出，MD5 .[^.]+.） \|',
                   f'| 01_论文/A26104850001.pdf | **流程图终审候选提交件**（仅替换图2-3/5-4/6-4/7-2，MD5 {after["named_pdf_md5_after"]}） |',s)
          marker='## 修复版相对交付版的差异'
          note=(f'> **2026-09-27 流程图终审更新：** A26104850001.pdf 已仅替换图2-3、图5-4、图6-4、图7-2；'
                f'新MD5为 {after["named_pdf_md5_after"]}。旧“修复_Windows导出.pdf”保留作替换前基线。'
                '正式提交前仍须用官方 FileMD5.exe 对最终文件现场生成识别码。\n\n')
          if note not in s: s=s.replace(marker,note+marker)
          rp.write_text(s,encoding='utf-8')
          print(json.dumps(rec,ensure_ascii=False,indent=2))
          PY
      - name: Commit final-submission-only changes
        run: |
          git add "最终提交_20260927"
          python - <<'PY'
          import subprocess
          ps=subprocess.check_output(['git','-c','core.quotePath=false','diff','--cached','--name-only']).decode().splitlines()
          assert all(p.startswith('最终提交_20260927/') for p in ps),ps
          print('\n'.join(ps))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Replace four final-paper flowcharts and refresh final-submission hashes'
          git push origin HEAD:final/submission-review-20260927
      - uses: actions/upload-artifact@v4
        with:
          name: final-submission-flowchart-review
          path: |
            最终提交_20260927/01_论文/A26104850001.pdf
            最终提交_20260927/01_论文/多核NPU切图调度论文_终审流程图版.docx
            最终提交_20260927/04_核验记录/最终提交终审_20260927.md
            最终提交_20260927/04_核验记录/流程图替换终审核验_20260927.json
            最终提交_20260927/04_核验记录/论文识别码MD5_预计算.txt
          retention-days: 7
