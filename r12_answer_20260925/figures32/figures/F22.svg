   </g>
   <g id="text_3">
    <text style="font-size: 9.3px; font-family: 'Times New Roman', 'Microsoft YaHei', 'DejaVu Sans'" transform="translate(67.495247 212.753297)">命中：L2读池</text>
    <text style="font-size: 9.3px; font-family: 'Times New Roman', 'Microsoft YaHei', 'DejaVu Sans'" transform="translate(66.855872 224.85138)">250 bytes/cycle</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.3px; font-family: 'Times New Roman', 'Microsoft YaHei', 'DejaVu Sans'" transform="translate(341.572762 212.753297)">未命中：DDR池</text>
